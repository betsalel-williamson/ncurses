name: Docs site

# Builds the documentation site (site/) from docs/ and man/, and deploys it to GitHub Pages.
# Pull requests build it without deploying. One-time setup: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Check the stitched man pages match man/
        run: docs/man/stitch.sh && git diff --exit-code man/
      - name: Install Emscripten, for the runnable examples
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache
      - name: Build the site
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    # Tell IndexNow search engines (Bing, Yandex, Seznam, Naver, ...) about the pages just deployed.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit the sitemap to IndexNow
        run: node site/scripts/indexnow.mjs "${{ needs.deploy.outputs.page_url }}"
