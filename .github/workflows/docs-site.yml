name: Docs site

# Deploys the documentation site to GitHub Pages after a push to master. The build and its
# checks live in docs-site-build.yml; docs-site-pr.yml runs them for pull requests, which never
# deploy. One-time setup: Settings > Pages > Source: GitHub Actions.
# Every action is pinned to a full commit SHA, with its release in a comment; Dependabot
# (.github/dependabot.yml) proposes updates once a release is 7 days old.
#
# A merge deploys the site its pull request already built and checked, when that build is of
# exactly the same source. A pull request's run (docs-site-pr.yml) checks out the merge of the
# pull request into master and uploads its site as site-<tree>, named by that merge's git tree
# hash. After a push to master, the reuse job looks for site-<tree of master>: from
# docs-site-pr.yml, run on a pull request from this repository (not a fork), that passed. If
# one exists, its files are what deploys, and the build job is skipped. If not (master moved
# after the pull request's last run, or the artifact expired), the build job builds and checks
# master as before.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # to find and download another run's artifact
    outputs:
      reused: ${{ steps.find.outputs.artifact-id != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find a passing pull-request build of this exact tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "Looking for site-$tree"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=site-$tree&per_page=20" \
            --jq '.artifacts[] | select(.expired | not)
                  | [.id, .workflow_run.id, .workflow_run.head_repository_id] | @tsv' > found.tsv
          want=$(printf '%s\t%s\t%s' .github/workflows/docs-site-pr.yml pull_request success)
          while IFS=$'\t' read -r id run repo_id; do
            [ "$repo_id" = "$GITHUB_REPOSITORY_ID" ] || continue
            got=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '[.path, .event, .conclusion] | @tsv')
            [ "$got" = "$want" ] || continue
            echo "Deploying artifact $id from run $run"
            echo "artifact-id=$id" >> "$GITHUB_OUTPUT"
            echo "run-id=$run" >> "$GITHUB_OUTPUT"
            exit 0
          done < found.tsv
          echo "No passing pull-request build of this tree; the build job will build it."
      - if: steps.find.outputs.artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.find.outputs.artifact-id }}
          run-id: ${{ steps.find.outputs.run-id }}
          github-token: ${{ github.token }}
          path: site/dist
      - if: steps.find.outputs.artifact-id != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  build:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    uses: ./.github/workflows/docs-site-build.yml

  deploy:
    needs: [reuse, build]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/master'
      && (needs.reuse.outputs.reused == 'true' || needs.build.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  indexnow:
    # Tell IndexNow search engines (Bing, Yandex, Seznam, Naver, ...) about the pages just deployed.
    needs: deploy
    # deploy can succeed while build is skipped (a reused build). A job with no if inherits
    # success(), which treats a skipped job anywhere upstream as a failure, so say what counts.
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: site
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Submit the sitemap to IndexNow
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node site/scripts/indexnow.mjs "$PAGE_URL"
