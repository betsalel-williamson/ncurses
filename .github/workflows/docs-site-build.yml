name: Docs site build

# Builds and checks the documentation site (site/) from docs/ and man/. Both docs-site-pr.yml
# (pull requests) and docs-site.yml (master) call it. On a pull request it keeps the built site
# as the artifact site-<tree>, which docs-site.yml deploys after the merge when master's tree is
# the same. On master it hands the site to GitHub Pages.

on:
  workflow_call:
    inputs:
      publish:
        description: On master, hand the site to GitHub Pages. docs-site.yml's cache job sets it to false.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the errata check looks up each row's commit
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pandoc
        # The release archive, checked against its hash: a few seconds, where apt-get update
        # took fifteen. 3.1.3 is the version Ubuntu 24.04 packages, which the site was built with.
        env:
          PANDOC_VERSION: 3.1.3
          PANDOC_SHA256: 74bc434908e4d858b3edbfd6271d2e9e499477837e5df1d630df4e62f113803d
        run: |
          curl -sSLo /tmp/pandoc.tar.gz "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          echo "${PANDOC_SHA256}  /tmp/pandoc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pandoc.tar.gz -C /tmp
          echo "/tmp/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Check the stitched man pages match man/
        # Prints both hashes of every sharded page, so the log shows the comparison.
        run: |
          out=$(mktemp -d)
          docs/man/stitch.sh "$out"
          status=0
          for page in "$out"/*; do
            name=$(basename "$page")
            want=$(git show "HEAD:man/$name" | sha256sum | cut -c1-64)
            got=$(sha256sum < "$page" | cut -c1-64)
            if [ "$want" = "$got" ]; then mark=ok; else mark=DIFFERS; status=1; fi
            printf '%-24s man/ %s  stitched %s  %s\n' "$name" "$want" "$got" "$mark"
          done
          docs/man/stitch.sh && git diff --exit-code man/ && exit "$status"
      - name: Require an errata entry when a pull request changes the docs
        # docs/appendix/errata.csv is the running list of every change this edition makes. A pull
        # request that changes a shard adds its rows there, or carries the no-errata label.
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-errata')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD)
          if echo "$changed" | grep -qE '^docs/(client-library|man)/' && ! echo "$changed" | grep -qx 'docs/appendix/errata.csv'; then
            echo "::error file=docs/appendix/errata.csv::This pull request changes the docs; add its changes to docs/appendix/errata.csv, or label the pull request no-errata if no reader sees the change."
            exit 1
          fi
      - name: Check the errata list
        run: node site/scripts/errata.mjs
      - name: Lint the guides with Vale
        env:
          VALE_VERSION: 3.26.0
          VALE_SHA256: 22aa69a556558e4a9dfc63c17030777383d8d3c48dcdfad655fa98e839d666ed
        run: |
          curl -sSLo /tmp/vale.tar.gz "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  /tmp/vale.tar.gz" | sha256sum -c -
          tar -xzf /tmp/vale.tar.gz -C /tmp vale
          /tmp/vale --config docs/.vale.ini docs/client-library docs/appendix
      - name: Check the C listings' style
        env:
          # The x86_64 Linux wheel of clang-format 18.1.3 on PyPI; pip refuses any other file.
          CLANG_FORMAT_REQ: clang-format==18.1.3 --hash=sha256:059f2c2e7166f97cf06f78d9bd31d83a9c0416527845cb397296daa43bd2c6e2
        run: |
          python3 -m venv /tmp/clang-format
          echo "$CLANG_FORMAT_REQ" > /tmp/clang-format.txt
          /tmp/clang-format/bin/pip install --quiet --disable-pip-version-check --require-hashes -r /tmp/clang-format.txt
          PATH="/tmp/clang-format/bin:$PATH" node site/scripts/check-listings.mjs
      - name: Install Emscripten, for the runnable examples
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 7.0.0
          actions-cache-folder: emsdk-cache
          # The action's default key starts with the workflow's name, which differs between
          # docs-site-pr.yml and docs-site.yml, so a pull request never found master's copy and
          # downloaded the 320 MB toolchain again on its first run. One key for both fixes that.
          cache-key: emsdk-7.0.0-${{ runner.os }}-${{ runner.arch }}
      # Caches. A pull request can restore only what its own branch or master saved, so
      # docs-site.yml's cache job saves these on master after every merge.
      - name: Key the WebAssembly ncurses build by its sources
        id: ncurses-key
        # Every tracked file outside the docs, the site and CI, so a docs change keeps the key,
        # plus the script that configures the build.
        run: |
          sources=$(git ls-files -s -- . ':!docs' ':!site' ':!man' ':!.github' | sha256sum | cut -c1-16)
          script=$(sha256sum site/scripts/build-examples.mjs | cut -c1-16)
          echo "key=ncurses-wasm-emsdk-7.0.0-$sources-$script" >> "$GITHUB_OUTPUT"
      - name: Restore the WebAssembly ncurses build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: site/.generated/ncurses-wasm
          key: ${{ steps.ncurses-key.outputs.key }}
      - name: Restore the built examples
        # A partial restore: the newest saved set comes back, and build-examples.mjs rebuilds
        # only the listings whose inputs changed (it keys each build by a hash of them).
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: site/.generated/example-cache
          key: examples-v1-${{ steps.ncurses-key.outputs.key }}-${{ hashFiles('docs/client-library/**/*.md', 'site/examples/**', 'site/scripts/build-examples.mjs', 'site/scripts/examples.mjs', 'site/scripts/smoke-example.mjs') }}
          restore-keys: |
            examples-v1-${{ steps.ncurses-key.outputs.key }}-
            examples-v1-
      - name: Build the site
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Check the built pages for Markdown shown as text
        run: node site/scripts/check-rendered.mjs
      - name: Name the build by its source tree
        if: github.event_name == 'pull_request'
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Keep the build, for the deploy when this pull request merges
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ steps.tree.outputs.tree }}
          path: site/dist
          retention-days: 30
          if-no-files-found: error
      - if: github.event_name != 'pull_request' && inputs.publish
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
