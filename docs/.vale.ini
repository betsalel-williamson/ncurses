# Vale checks for the GFM guides. Run from the repo root: vale --config docs/.vale.ini docs/client-library
# The MerlonDocs style is fetched, not committed: run site/scripts/vale-styles.sh first.
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = MerlonDocs
# The preset ships this rule as a warning; here a code name outside backticks fails the build.
MerlonDocs.UnformattedCode = error
